<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>よるのお部屋 🌙 AI×ゆる副業と愛用ガジェットまとめ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       よるのお部屋 × デジタル庁デザインシステム（DADS）準拠トークン
       - 線アイコン（SVG Stroke Icons）による洗練されたUI
       - ビジュアルサムネイル枠対応（画像URLまたは内蔵SVGグラフィック）
       ========================================================================== */
    :root {
      --bg-canvas: #0d0e12;
      --bg-surface: #171921;
      --bg-surface-elevated: #20232e;
      --bg-comment: #232734;

      --border-subtle: #2e3344;
      --border-strong: #495068;
      --border-focus: #ffd470;

      --text-primary: #f8f9fc;
      --text-secondary: #cfd4e3;
      --text-muted: #9da5bd;
      --text-on-accent: #101218;

      --accent-gold: #f5cf6b;
      --accent-gold-hover: #fae094;

      --cat-ai-bg: rgba(114, 239, 248, 0.14);
      --cat-ai-text: #8ef5fc;
      --cat-ai-border: rgba(114, 239, 248, 0.4);

      --cat-brain-bg: rgba(255, 143, 179, 0.14);
      --cat-brain-text: #ffadc7;
      --cat-brain-border: rgba(255, 143, 179, 0.4);

      --cat-gadget-bg: rgba(255, 183, 107, 0.14);
      --cat-gadget-text: #ffca8a;
      --cat-gadget-border: rgba(255, 183, 107, 0.4);

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(245, 207, 107, 0.06) 0%, transparent 30%),
        radial-gradient(circle at 85% 50%, rgba(255, 143, 163, 0.04) 0%, transparent 35%);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.75;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      padding-bottom: var(--space-7);
    }

    :focus-visible {
      outline: 3px solid var(--border-focus);
      outline-offset: 2px;
    }

    /* 線アイコン共通スタイル */
    .icon-svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: var(--space-5) var(--space-4);
    }

    /* 1. プロフィールヘッダー */
    .profile-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-6) var(--space-5);
      margin-bottom: var(--space-6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    @media (max-width: 480px) {
      .profile-top {
        flex-direction: column;
        text-align: center;
      }
    }

    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid var(--accent-gold);
      background: #000;
    }

    .star-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--bg-surface-elevated);
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-gold);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-heading {
      flex: 1;
    }

    .profile-role {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.06em;
      margin-bottom: var(--space-1);
    }

    .profile-name {
      font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .profile-bio {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.75;
      margin-bottom: var(--space-5);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-subtle);
    }

    .sns-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }

    .sns-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-height: 44px;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 700;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .sns-btn:hover {
      background: #2b3040;
      border-color: var(--accent-gold);
    }

    /* 2. カテゴリフィルタタブ */
    .filter-nav {
      margin-bottom: var(--space-5);
    }

    .filter-label {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: var(--space-2);
      display: block;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-2);
    }

    @media (max-width: 520px) {
      .tabs {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .tab-btn {
      min-height: 44px;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--accent-gold);
      color: var(--text-on-accent);
      border-color: var(--accent-gold);
      box-shadow: 0 2px 10px rgba(245, 207, 107, 0.25);
    }

    /* 3. セクション見出し */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 2px solid var(--border-subtle);
    }

    .section-title {
      font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .meta-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }

    /* 4. アイテムカード＆ビジュアルサムネイル */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .item-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .item-card:hover {
      border-color: var(--border-strong);
    }

    /* ビジュアルプレビュー領域 (画像が指定された時のみ表示) */
    .card-visual {
      width: 100%;
      max-height: 200px;
      aspect-ratio: 16 / 9;
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .card-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: var(--space-5);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }

    .category-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
    }

    .category-tag.ai {
      background: var(--cat-ai-bg);
      color: var(--cat-ai-text);
      border-color: var(--cat-ai-border);
    }

    .category-tag.brain {
      background: var(--cat-brain-bg);
      color: var(--cat-brain-text);
      border-color: var(--cat-brain-border);
    }

    .category-tag.rakuten {
      background: var(--cat-gadget-bg);
      color: var(--cat-gadget-text);
      border-color: var(--cat-gadget-border);
    }

    .price-note {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .item-title {
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text-primary);
      margin-bottom: var(--space-4);
    }

    /* よるのひとことレビュー */
    .review-box {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      background: var(--bg-comment);
      border-left: 3px solid var(--accent-gold);
      padding: var(--space-3) var(--space-4);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-bottom: var(--space-4);
    }

    .mini-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent-gold);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .review-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .review-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 2px;
    }

    /* 使い方ステップボックス（Muse AI等の解説用） */
    .guide-steps {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      font-size: 0.875rem;
      color: var(--text-primary);
      display: none;
    }

    .guide-steps.open {
      display: block;
    }

    .guide-steps-title {
      font-weight: 700;
      color: var(--cat-ai-text);
      margin-bottom: var(--space-2);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .guide-step-item {
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-subtle);
      color: var(--text-secondary);
    }

    .guide-step-item:last-child {
      border-bottom: none;
    }

    /* CTAボタン */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 48px;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      background: var(--accent-gold);
      color: var(--text-on-accent);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9375rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .cta-btn.secondary-action {
      background: var(--bg-surface-elevated);
      color: var(--cat-ai-text);
      border: 1.5px solid var(--cat-ai-border);
    }

    .cta-btn:hover {
      background: var(--accent-gold-hover);
    }

    .cta-btn.secondary-action:hover {
      background: rgba(114, 239, 248, 0.22);
    }

    .footer-notice {
      margin-top: var(--space-7);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-subtle);
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- 1. プロフィール領域 -->
    <header class="profile-card" aria-label="プロフィール">
      <div class="profile-top">
        <div class="avatar-wrapper">
          <img src="assets/avatar.webp" alt="よるのアイコン" class="avatar">
          <div class="star-badge" aria-hidden="true">
            <svg class="icon-svg" style="width:14px;height:14px;" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
        </div>
        <div class="profile-heading">
          <span class="profile-role">AI × ゆる副業 ＆ デスク環境ログ</span>
          <h1 class="profile-name">よるのお部屋 🌙</h1>
        </div>
      </div>
      <p class="profile-bio">
        黒パーカーで夜な夜なAI（Meta Muse AIなどで動画・イラスト生成）をいじっているインドア女子です。<br>
        「むずかしい専門知識なしで、楽しくお小遣い稼ぎ」をテーマに、私のAI活用レシピや、実際に学んでよかったBrain教材・愛用デスクガジェットをまとめています。
      </p>
      <nav class="sns-links" aria-label="SNSリンク">
        <a href="https://x.com/yoru_2521" target="_blank" rel="noopener noreferrer" class="sns-btn">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 4l11.733 16h4.267l-11.733 -16z"/><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/></svg>
          <span>X (@yoru_2521)</span>
        </a>
        <a href="https://www.threads.com/@yoru_2521" target="_blank" rel="noopener noreferrer" class="sns-btn">
          <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
          <span>Threads (@yoru_2521)</span>
        </a>
      </nav>
    </header>

    <!-- 2. カテゴリ絞り込みナビゲーション（線アイコン仕様） -->
    <section class="filter-nav" aria-label="カテゴリ絞り込み">
      <span class="filter-label">カテゴリで絞り込む（タップで切替）</span>
      <div class="tabs" role="tablist">
        <button class="tab-btn" role="tab" aria-selected="true" onclick="filterItems('all', this)">
          <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>すべて</span>
        </button>
        <button class="tab-btn" role="tab" aria-selected="false" onclick="filterItems('ai', this)">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/></svg>
          <span>AI活用術</span>
        </button>
        <button class="tab-btn" role="tab" aria-selected="false" onclick="filterItems('brain', this)">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>Brain教材</span>
        </button>
        <button class="tab-btn" role="tab" aria-selected="false" onclick="filterItems('rakuten', this)">
          <svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg>
          <span>ガジェット</span>
        </button>
      </div>
    </section>

    <!-- 3. アイテム一覧領域 -->
    <section aria-labelledby="pickup-heading">
      <div class="section-header">
        <h2 class="section-title" id="pickup-heading">
          <svg class="icon-svg" style="color:var(--accent-gold);" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>おすすめピックアップ</span>
        </h2>
        <span class="meta-badge" id="last-updated">更新日: 2026/11/08</span>
      </div>

      <div class="card-list" id="item-container" role="region" aria-live="polite">
      </div>
    </section>

    <footer class="footer-notice">
      <p>※当ページのリンクにはプロモーション（アフィリエイトプログラム）が含まれます。</p>
    </footer>
  </main>

  <script src="site_data.js"></script>
  <script>
    function renderItems(filter = 'all') {
      const container = document.getElementById('item-container');
      const updatedEl = document.getElementById('last-updated');
      if (siteData.lastUpdated && updatedEl) {
        updatedEl.textContent = '更新日: ' + siteData.lastUpdated;
      }
      container.innerHTML = '';

      const filtered = siteData.items.filter(item => filter === 'all' || item.category === filter);

      filtered.forEach((item, idx) => {
        const article = document.createElement('article');
        article.className = 'item-card';

        // 画像が設定されている場合のみ画像枠を表示、ない時は枠ごと非表示
        const visualHtml = item.image && item.image.trim() !== ''
          ? `<div class="card-visual"><img src="${item.image}" alt="${item.title}" loading="lazy"></div>`
          : '';

        let guideHtml = '';
        let ctaHtml = '';

        if (item.guideSteps && item.guideSteps.length > 0) {
          const stepId = `guide-step-box-${idx}`;
          const stepsList = item.guideSteps.map(s => `<div class="guide-step-item">${s}</div>`).join('');
          guideHtml = `
            <div class="guide-steps" id="${stepId}">
              <div class="guide-steps-title">
                <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <span>よるが実践している3ステップ</span>
              </div>
              ${stepsList}
            </div>
          `;
          ctaHtml = `
            <button type="button" class="cta-btn secondary-action" onclick="toggleGuide('${stepId}', this)">
              <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
              <span>${item.btnText}</span>
            </button>
          `;
        } else {
          ctaHtml = `
            <a href="${item.url}" class="cta-btn" target="_blank" rel="noopener noreferrer" onclick="trackClick('${item.id || item.title}')">
              <span>${item.btnText}</span>
              <svg class="icon-svg" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          `;
        }

        article.innerHTML = `
          ${visualHtml}
          <div class="card-body">
            <div class="card-meta">
              <span class="category-tag ${item.category}">${item.badgeText}</span>
              <span class="price-note">${item.priceNote}</span>
            </div>
            <h3 class="item-title">${item.title}</h3>
            <div class="review-box">
              <img src="assets/avatar.webp" alt="" class="mini-avatar" aria-hidden="true">
              <div class="review-text">
                <span class="review-label">よるのひとことレビュー 🌙</span>
                ${item.comment}
              </div>
            </div>
            ${guideHtml}
            ${ctaHtml}
          </div>
        `;
        container.appendChild(article);
      });
    }

    function toggleGuide(id, btn) {
      const box = document.getElementById(id);
      const isOpen = box.classList.toggle('open');
      btn.querySelector('span').textContent = isOpen ? '活用ステップを閉じる' : 'よるのMuse AI活用ステップを見る';
      trackClick(id);
    }

    function filterItems(category, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected', 'false'));
      btnEl.setAttribute('aria-selected', 'true');
      renderItems(category);
    }

    function trackClick(itemId) {
      const current = parseInt(localStorage.getItem('yoru_total_clicks') || '0', 10);
      localStorage.setItem('yoru_total_clicks', String(current + 1));
    }

    renderItems();
  </script>
</body>
</html>
