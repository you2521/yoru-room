<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>よるのお部屋 🌙 AI×ゆる副業と愛用ガジェットまとめ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       よるのお部屋 × デジタル庁デザインシステム（DADS）準拠トークン
       - 8px グリッドシステム (8 / 16 / 24 / 32 / 48px)
       - WCAG AA/AAA コントラスト比 (4.5:1〜7:1以上) を満たすダークパレット
       - 最小タップ領域 44px×44px 以上・キーボードフォーカス可視化
       ========================================================================== */
    :root {
      /* Surface & Background */
      --bg-canvas: #0d0e12;
      --bg-surface: #171921;
      --bg-surface-elevated: #20232e;
      --bg-comment: #252936;

      /* Borders & Dividers */
      --border-subtle: #2e3344;
      --border-strong: #495068;
      --border-focus: #ffd470;

      /* Text Colors (WCAG AAA〜AA High Contrast on Dark) */
      --text-primary: #f8f9fc;     /* コントラスト比 17:1 */
      --text-secondary: #cfd4e3;   /* コントラスト比 11:1 */
      --text-muted: #9da5bd;       /* コントラスト比 6.2:1 */
      --text-on-accent: #101218;   /* ゴールド背景上の濃色テキスト (12:1) */

      /* Brand & Semantic Accents */
      --accent-gold: #f5cf6b;
      --accent-gold-hover: #fae094;
      --accent-pink: #ff8fa3;

      /* Category Semantic Tokens (高視認性ピル) */
      --cat-ai-bg: rgba(114, 239, 248, 0.16);
      --cat-ai-text: #8ef5fc;
      --cat-ai-border: rgba(114, 239, 248, 0.45);

      --cat-brain-bg: rgba(255, 143, 179, 0.16);
      --cat-brain-text: #ffadc7;
      --cat-brain-border: rgba(255, 143, 179, 0.45);

      --cat-gadget-bg: rgba(255, 183, 107, 0.16);
      --cat-gadget-text: #ffca8a;
      --cat-gadget-border: rgba(255, 183, 107, 0.45);

      /* Spacing Scale (8px Grid) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;

      /* Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* 本文は可読性の高い Noto Sans JP、見出しでキャラクター性のある丸ゴシックを併用 */
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(245, 207, 107, 0.07) 0%, transparent 30%),
        radial-gradient(circle at 85% 50%, rgba(255, 143, 163, 0.05) 0%, transparent 35%);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.75;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      padding-bottom: var(--space-7);
    }

    /* アクセシビリティ: キーボード操作時のフォーカスリング */
    :focus-visible {
      outline: 3px solid var(--border-focus);
      outline-offset: 2px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: var(--space-5) var(--space-4);
    }

    /* ==========================================================================
       1. プロフィールヘッダー (情報階層の明確化)
       ========================================================================== */
    .profile-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-6) var(--space-5);
      margin-bottom: var(--space-6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    @media (max-width: 480px) {
      .profile-top {
        flex-direction: column;
        text-align: center;
      }
    }

    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid var(--accent-gold);
      background: #000;
    }

    .star-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--bg-surface-elevated);
      border: 1.5px solid var(--accent-gold);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .profile-heading {
      flex: 1;
    }

    .profile-role {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.06em;
      margin-bottom: var(--space-1);
    }

    .profile-name {
      font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .profile-bio {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.75;
      margin-bottom: var(--space-5);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-subtle);
    }

    .sns-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }

    .sns-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-height: 44px; /* DADS タッチターゲット基準 */
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 700;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .sns-btn:hover {
      background: #2b3040;
      border-color: var(--accent-gold);
    }

    /* ==========================================================================
       2. カテゴリフィルタタブ (操作性と現在位置の明示)
       ========================================================================== */
    .filter-nav {
      margin-bottom: var(--space-5);
    }

    .filter-label {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: var(--space-2);
      display: block;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-2);
    }

    @media (max-width: 520px) {
      .tabs {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .tab-btn {
      min-height: 44px; /* タップ領域44px以上 */
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--accent-gold);
      color: var(--text-on-accent);
      border-color: var(--accent-gold);
      box-shadow: 0 2px 10px rgba(245, 207, 107, 0.25);
    }

    /* ==========================================================================
       3. セクション見出し＆メタ情報
       ========================================================================== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 2px solid var(--border-subtle);
    }

    .section-title {
      font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .meta-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }

    /* ==========================================================================
       4. アイテムカード (視線誘導: メタ情報 → 見出し → レビュー吹き出し → CTA)
       ========================================================================== */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .item-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .item-card:hover {
      border-color: var(--border-strong);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }

    .category-tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
    }

    .category-tag.ai {
      background: var(--cat-ai-bg);
      color: var(--cat-ai-text);
      border-color: var(--cat-ai-border);
    }

    .category-tag.brain {
      background: var(--cat-brain-bg);
      color: var(--cat-brain-text);
      border-color: var(--cat-brain-border);
    }

    .category-tag.rakuten {
      background: var(--cat-gadget-bg);
      color: var(--cat-gadget-text);
      border-color: var(--cat-gadget-border);
    }

    .price-note {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .item-title {
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text-primary);
      margin-bottom: var(--space-4);
    }

    /* キャラクターの一言レビュー（背景コントラストと境界を明確化） */
    .review-box {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      background: var(--bg-comment);
      border-left: 3px solid var(--accent-gold);
      padding: var(--space-3) var(--space-4);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-bottom: var(--space-5);
    }

    .mini-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent-gold);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .review-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .review-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 2px;
    }

    /* プライマリCTAボタン (DADS基準: 最小高さ48px・高コントラスト・外部リンク明示) */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 48px;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      background: var(--accent-gold);
      color: var(--text-on-accent);
      font-weight: 700;
      font-size: 0.9375rem;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .cta-btn:hover {
      background: var(--accent-gold-hover);
    }

    .cta-btn:active {
      transform: translateY(1px);
    }

    /* フッター・広告表記（ステマ規制対応の明瞭な表示） */
    .footer-notice {
      margin-top: var(--space-7);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-subtle);
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- 1. プロフィール領域 -->
    <header class="profile-card" aria-label="プロフィール">
      <div class="profile-top">
        <div class="avatar-wrapper">
          <img src="assets/avatar.webp" alt="よるのアイコン" class="avatar">
          <div class="star-badge" aria-hidden="true">⭐</div>
        </div>
        <div class="profile-heading">
          <span class="profile-role">AI × ゆる副業 ＆ デスク環境ログ</span>
          <h1 class="profile-name">よるのお部屋 🌙</h1>
        </div>
      </div>
      <p class="profile-bio">
        黒パーカーで夜な夜なAI（音楽・イラスト生成）をいじっているインドア女子です☕<br>
        「むずかしい専門知識なしで、楽しくお小遣い稼ぎ」をテーマに、実際に使ってよかった神AIツール・Brain教材・愛用デスクガジェットを分かりやすくまとめています✨
      </p>
      <nav class="sns-links" aria-label="SNSリンク">
        <a href="#x-link" class="sns-btn">𝕏 最新ポストを見る</a>
        <a href="#threads-link" class="sns-btn">Threads を見る</a>
      </nav>
    </header>

    <!-- 2. カテゴリ絞り込みナビゲーション -->
    <section class="filter-nav" aria-label="カテゴリ絞り込み">
      <span class="filter-label">カテゴリで絞り込む（タップで切替）</span>
      <div class="tabs" role="tablist">
        <button class="tab-btn" role="tab" aria-selected="true" onclick="filterItems('all', this)">すべて表示</button>
        <button class="tab-btn" role="tab" aria-selected="false" onclick="filterItems('ai', this)">🎵 AIツール</button>
        <button class="tab-btn" role="tab" aria-selected="false" onclick="filterItems('brain', this)">📚 Brain教材</button>
        <button class="tab-btn" role="tab" aria-selected="false" onclick="filterItems('rakuten', this)">⌨️ ガジェット</button>
      </div>
    </section>

    <!-- 3. アイテム一覧領域 -->
    <section aria-labelledby="pickup-heading">
      <div class="section-header">
        <h2 class="section-title" id="pickup-heading">
          <span aria-hidden="true">⭐</span> おすすめピックアップ
        </h2>
        <span class="meta-badge" id="last-updated">更新日: 2026/11/08</span>
      </div>

      <div class="card-list" id="item-container" role="region" aria-live="polite">
        <!-- site_data.js から自動描画 -->
      </div>
    </section>

    <footer class="footer-notice">
      <p>※当ページのリンクにはプロモーション（アフィリエイトプログラム）が含まれます。</p>
    </footer>
  </main>

  <script src="site_data.js"></script>
  <script>
    function renderItems(filter = 'all') {
      const container = document.getElementById('item-container');
      const updatedEl = document.getElementById('last-updated');
      if (siteData.lastUpdated && updatedEl) {
        updatedEl.textContent = '更新日: ' + siteData.lastUpdated;
      }
      container.innerHTML = '';

      const filtered = siteData.items.filter(item => filter === 'all' || item.category === filter);

      filtered.forEach(item => {
        const article = document.createElement('article');
        article.className = 'item-card';
        article.innerHTML = `
          <div class="card-meta">
            <span class="category-tag ${item.category}">${item.badgeText}</span>
            <span class="price-note">${item.priceNote}</span>
          </div>
          <h3 class="item-title">${item.title}</h3>
          <div class="review-box">
            <img src="assets/avatar.webp" alt="" class="mini-avatar" aria-hidden="true">
            <div class="review-text">
              <span class="review-label">よるのひとことレビュー🌙</span>
              ${item.comment}
            </div>
          </div>
          <a href="${item.url}" class="cta-btn" target="_blank" rel="noopener noreferrer" onclick="trackClick('${item.id || item.title}')">
            <span>${item.btnText}</span>
          </a>
        `;
        container.appendChild(article);
      });
    }

    function filterItems(category, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected', 'false'));
      btnEl.setAttribute('aria-selected', 'true');
      renderItems(category);
    }

    function trackClick(itemId) {
      const current = parseInt(localStorage.getItem('yoru_total_clicks') || '0', 10);
      localStorage.setItem('yoru_total_clicks', String(current + 1));
    }

    renderItems();
  </script>
</body>
</html>
